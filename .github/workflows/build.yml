name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle build --no-daemon
      - name: Проверка версии
        if: github.event_name == 'pull_request'
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' build.gradle.kts)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::warning::Версия $VERSION уже выпущена — после мержа релиз не появится. Поднимите version в build.gradle.kts."
          else
            echo "::notice::После мержа будет выпущен релиз v$VERSION."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Origin-Weapon
          path: build/libs/*.jar
