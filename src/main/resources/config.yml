# ─────────────────────────────────────────────────────────────
#  Origin-Weapon — настройки
#  Новые предметы дописываются в этот файл автоматически при
#  обновлении плагина. Уже изменённые значения не перезаписываются.
# ─────────────────────────────────────────────────────────────

config-version: 1

# Включить отладочные сообщения в консоль
debug: false

# Каждый предмет — отдельная секция по его id.
# Общие поля для всех предметов:
#   enabled   — true/false, полностью выключает предмет и его способности
#   name      — имя предмета (MiniMessage)
#   lore      — описание (MiniMessage, список строк)
#   Остальные поля — параметры конкретного предмета (урон, кулдаун и т.д.)
items: {}
#  example_item:
#    enabled: true
#    name: "<gold>Пример"
#    lore:
#      - "<gray>Описание предмета"
#    cooldown-seconds: 10
